name: STOCycle

options:
  bundleIdPrefix: no.stostore
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    TARGETED_DEVICE_FAMILY: 1
    SUPPORTS_MACCATALYST: false
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  STOCycle:
    type: application
    platform: iOS
    sources:
      - path: STOCycle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.stostore.cycle
        PRODUCT_NAME: STOCycle
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: "STÖ Cycle"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDarkContent
        SWIFT_EMIT_LOC_STRINGS: true
  STOCycleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: STOCycleTests
    dependencies:
      - target: STOCycle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.stostore.cycle.tests
        GENERATE_INFOPLIST_FILE: true
  STOCycleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: STOCycleUITests
    dependencies:
      - target: STOCycle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.stostore.cycle.uitests
        GENERATE_INFOPLIST_FILE: true

schemes:
  STOCycle:
    build:
      targets:
        STOCycle: all
        STOCycleTests: [test]
        STOCycleUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - STOCycleTests
        - STOCycleUITests
